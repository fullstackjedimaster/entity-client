services:
  entity-client:
    build:
      context: ../
      dockerfile: deploy/docker/entity-client/Dockerfile
      env_file:
        - ./env/postgres.env
        - ./env/cloud.env
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3005"
      HOSTNAME: "0.0.0.0"
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8003}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "127.0.0.1:3005:3005"

    init: true